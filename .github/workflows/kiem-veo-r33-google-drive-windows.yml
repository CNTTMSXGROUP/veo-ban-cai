name: Mở bản sao Vèo Mac r27 qua Google Drive trên Windows r33
on:
  push:
    branches: [kiem-veo-r33-drive-nhan]
permissions:
  contents: read
jobs:
  nhan:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Nhận đúng tệp đã tải lại từ Google Drive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-drive-r33'
          $Bundle = 'Veo-QA-r27-q8l5-tai-tu-Google-Drive.zip'
          $Dest = Join-Path $Qa 'may-gui'
          $Tag = 'veo-qa-windows-20261126-7bc6cdf'
          if ((gh release view $Tag -R $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft) -ne 'true') { throw 'Không thấy bản nháp kiểm thử.' }
          gh release download $Tag -R $env:GITHUB_REPOSITORY --pattern $Bundle --dir $Qa
          $Zip = Join-Path $Qa $Bundle
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $Zip).Hash -ne 'f420e1375b498f23808912c3cf6e8450f76495fb181397a9aff51b499831eaec') { throw 'Không đúng tệp tải từ Google Drive.' }
          Expand-Archive -LiteralPath $Zip -DestinationPath $Dest
          if (!(Test-Path -LiteralPath (Join-Path $Dest 'drive/Bản đồng bộ Vèo') -PathType Container)) { throw 'Tên thư mục đồng bộ bị đổi khi chuyển tệp.' }
          $Sender = Get-Content -LiteralPath (Join-Path $Dest 'ket-qua.json') -Raw -Encoding utf8 | ConvertFrom-Json
          if (!$Sender.guiBangCuaSo -or $Sender.workerSha256 -ne '2743e3bf2fe283e1c165ffda4e4abc1f96c51c3efc90c28a508cb81378736085') {
            throw 'Mẫu phải do cửa sổ Vèo Mac r27 ghi.'
          }
      - name: Cài đúng Vèo Windows r33
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-drive-r33'
          $Tag = 'veo-qa-windows-20261126-7bc6cdf'
          $Name = 'Veo-Windows-Signed-Flow-QA_0.3.24_x64-setup-r33.exe'
          if ((gh release view $Tag -R $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft) -ne 'true') { throw 'Không thấy bản nháp kiểm thử.' }
          gh release download $Tag -R $env:GITHUB_REPOSITORY --dir $Qa --pattern $Name
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash (Join-Path $Qa $Name)).Hash -ne '093647c89e5a55fa1f105e465ba1b600ad55ef78aa33402ca6f5b2c5eec6ac78') { throw 'Sai bộ cài thử.' }
          $Install = Join-Path $Qa 'app'
          if ($env:GITHUB_ACTIONS -ne 'true' -or (Test-Path $Install)) { throw 'Cần máy thử có thư mục cài trống.' }
          $Process = Start-Process (Join-Path $Qa $Name) -ArgumentList @('/S',"/D=$Install") -PassThru
          if (!$Process.WaitForExit(240000)) { $Process.Kill($true); throw 'Cài Vèo quá thời gian.' }
          if ($Process.ExitCode -ne 0 -or (Get-Item (Join-Path $Install 'msx-phong-dung.exe')).VersionInfo.FileVersion -notmatch '^0\.3\.24(\.0)?$') { throw 'Sai phiên bản đã cài.' }
      - name: Kiểm thiếu tệp, khôi phục khi ngắt và xuất bằng clip gốc
        shell: pwsh
        run: |
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-drive-r33'
          $Install = Join-Path $Qa 'app'
          $env:VEO_QA_WORKER_SHA = (Get-FileHash (Join-Path $Install 'worker/dung-app.mjs')).Hash.ToLowerInvariant()
          if ($env:VEO_QA_WORKER_SHA -ne '70930267c689bc91a09f31db2435e848d46b9f509360b85eef4046c7fd04ba54') { throw 'Sai mã phần dựng.' }
          $env:VEO_QA_SOURCE = 'a5c83fc344e43d056eb2cb191f5365bbb759f2f1'
          $env:VEO_QA_OS = (Get-CimInstance Win32_OperatingSystem).Caption
          $Data = Join-Path $env:APPDATA 'vn.msxgroup.phongdung'
          if (Test-Path $Data) { throw 'Cần máy thử có kho trống.' }
          $env:DUNG_CHEP_LOI = 'may'
          $env:NO_PROXY = '127.0.0.1,localhost'
          $Script = Join-Path $Qa 'kiem-drive-r27-windows.ps1'
          Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/scripts/windows/kiem-drive-r27-windows.ps1" -OutFile $Script
          & pwsh -NoProfile -STA -File $Script -Install $Install -Qa $Qa
          if ($LASTEXITCODE -ne 0) { throw 'Ca kiểm bản sao Drive thất bại.' }
      - name: Lưu kết quả máy nhận
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-r33-google-drive-windows
          path: ${{ runner.temp }}/veo-qa-drive-r33/minh-chung
          if-no-files-found: warn
          retention-days: 30
