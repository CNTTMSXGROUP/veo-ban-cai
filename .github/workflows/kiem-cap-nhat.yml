name: Thử cập nhật Vèo ngay trong ứng dụng Windows
on:
  push:
    branches: [codex/kiem-cap-nhat-veo-0-3-17]
permissions: {}
jobs:
  cap-nhat:
    strategy:
      fail-fast: false
      matrix:
        thu_muc: [mac-dinh, tuy-chon]
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Cài và mở bản 0.3.16
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'Veo'
          $setup = Join-Path $env:RUNNER_TEMP 'veo-cu.exe'
          Invoke-WebRequest 'https://github.com/CNTTMSXGROUP/veo-ban-cai/releases/download/v0.3.16/Veo_0.3.16_x64-setup.exe' -OutFile $setup
          if ((Get-FileHash $setup).Hash -ne '0f5aafdb099d904af8ff92c101c54a241a5a7642662c74caccead439e8d58871') { throw 'Sai bộ cài cũ' }
          if ('${{ matrix.thu_muc }}' -eq 'mac-dinh') {
            $install = Join-Path $env:LOCALAPPDATA 'Vèo'
            $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          } else {
            $p = Start-Process $setup -ArgumentList '/S',"/D=$install" -Wait -PassThru
          }
          if ($p.ExitCode -ne 0) { throw 'Cài 0.3.16 thất bại' }
          $old = Get-ChildItem $install -File -Filter '*.exe' | Where-Object { $_.VersionInfo.ProductVersion -match '^0\.3\.16(\.0)?$' } | Select-Object -First 1
          if (!$old) { throw 'Không thấy app 0.3.16' }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Vèo'
          Get-ItemProperty $key | Select-Object Publisher,InstallLocation,DisplayVersion | Format-Table
          $app = Start-Process $old.FullName -PassThru
          try {
            $root = Join-Path $env:LOCALAPPDATA 'vn.msxgroup.phongdung'
            $until = (Get-Date).AddMinutes(4)
            do {
              if ($app.HasExited) { throw 'Bản cũ đã thoát trước khi nhận cập nhật' }
              $cache = Get-ChildItem $root -Recurse -Filter 'ban-0.3.17.bin' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($cache -and (Get-FileHash $cache.FullName).Hash -eq 'f0cfeb72a89ce5e63de20c787851da6d9a50587ffbbb6c3885a8945da100a599') { break }
              Start-Sleep 2
            } while ((Get-Date) -lt $until)
            if (!$cache -or (Get-FileHash $cache.FullName).Hash -ne 'f0cfeb72a89ce5e63de20c787851da6d9a50587ffbbb6c3885a8945da100a599') { throw 'App chưa tải được đúng gói từ kênh chính thức' }
            Write-Output 'Vèo 0.3.16 đã tự tải gói 0.3.17 đúng SHA-256.'
            Start-Sleep 2
            $app.Refresh()
            if (!$app.CloseMainWindow()) { throw 'Không thể đóng cửa sổ Vèo theo cách thông thường' }
            $until = (Get-Date).AddMinutes(3)
            do {
              Start-Sleep 2
              $where = (Get-ItemProperty $key -ErrorAction SilentlyContinue).InstallLocation
              if ($where) {
                $elsewhere = Join-Path ($where.Trim('"')) $old.Name
                if ((Test-Path $elsewhere) -and $elsewhere -ne $old.FullName -and [Diagnostics.FileVersionInfo]::GetVersionInfo($elsewhere).ProductVersion -match '^0\.3\.17(\.0)?$') {
                  throw "Bộ cài đã chuyển từ $($old.FullName) sang $elsewhere"
                }
              }
              $ver = [Diagnostics.FileVersionInfo]::GetVersionInfo($old.FullName).ProductVersion
              if ($ver -match '^0\.3\.17(\.0)?$') { break }
            } while ((Get-Date) -lt $until)
            if ($ver -notmatch '^0\.3\.17(\.0)?$') { throw "Ứng dụng tại vị trí cũ vẫn là $ver" }
            Write-Output "Đã nâng tại chỗ lên Vèo $ver trên Windows."
          } finally { if (!$app.HasExited) { $app.Kill($true) } }
