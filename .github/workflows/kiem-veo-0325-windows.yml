name: Kiểm cài và phát MP4 bằng Vèo Windows 0.3.25
on:
  push:
    branches: [kiem-veo-0325-windows]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - name: Cài đè lên 0.3.24, mở Vèo, xuất và phát từ bộ cài 0.3.25
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VEO_QA_WORKER_SHA: 3535893d20fa23e847cb9b59c84f9fa72ef302115f3eb8a15390a9abab61fc10
        run: |
          $ErrorActionPreference = 'Stop'
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-0325-win'
          New-Item -ItemType Directory -Path $Qa | Out-Null
          function Tai-Va-Kiem($Tag, $Name, $Hash) {
            gh release download $Tag -R $env:GITHUB_REPOSITORY --dir $Qa --pattern $Name
            if ($LASTEXITCODE -ne 0 -or (Get-FileHash (Join-Path $Qa $Name)).Hash -ne $Hash) { throw "Sai hoặc thiếu tệp $Name." }
          }
          Tai-Va-Kiem 'v0.3.24' 'Veo_0.3.24_x64-setup.exe' '1df366af3aa84f7847f45ed37fadb18dba4560442815363a591cf387c0b4d49a'
          Tai-Va-Kiem 'veo-qa-0325-win-657a2cee' 'Veo_0.3.25_x64-setup.exe' 'a1a89b7b8841632c6be434064d259cb973fc7b3048f32b0f680996f873aed4c2'
          Tai-Va-Kiem 'veo-qa-windows-20261126-7bc6cdf' 'qa-upgrade-voice.mp4' '4c99742130fb5cecd2f8f5ad7c8c3f718b11ea668b4e93ff9b2ac971606cff71'
          $Model = Join-Path $Qa 'ggml-base.en-q5_1.bin'
          curl.exe -L --max-time 180 --retry 2 --fail --silent --show-error 'https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.en-q5_1.bin?download=true' -o $Model
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $Model).Hash -ne '4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f') { throw 'Sai model tiếng Anh.' }
          foreach ($Name in 'kiem-kho-nang-cap.mjs','kiem-nang-cap-chinh.ps1','kiem-chuyen-kho.py','sau-khi-ghi.mjs') {
            Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/scripts/windows/$Name" -OutFile (Join-Path $Qa $Name)
          }
          & pwsh -NoProfile -STA -File (Join-Path $Qa 'kiem-nang-cap-chinh.ps1') -Qa $Qa -Ca mac-dinh -CheDo thay
          if ($LASTEXITCODE -ne 0) { throw 'Kiểm cài, xuất và phát MP4 thất bại.' }
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-0325-windows-657a2cee
          path: ${{ runner.temp }}/veo-qa-0325-win/minh-chung
          if-no-files-found: warn
          retention-days: 30
