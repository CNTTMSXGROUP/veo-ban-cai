name: Kiểm bộ cài Vèo 0.3.17
on:
  push:
    branches: [codex/kiem-veo-0-3-17]
permissions:
  contents: read
jobs:
  cai-va-mo:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Tải đúng bộ cài
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'veo-setup.exe'
          gh release download v0.3.17 -R CNTTMSXGROUP/veo-ban-cai -p 'Veo_0.3.17_x64-setup.exe' -O $setup
          if ($LASTEXITCODE -ne 0) { throw 'Chưa tải được bộ cài từ bản nháp' }
          if ((Get-FileHash $setup).Hash -ne 'c67b4b8e7cf896b7c67d88eaef51cbbd15a0877dd753211facb5d858754e5906') { throw 'Sai mã SHA-256' }
      - name: Cài và mở từ thư mục đã cài
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'Veo'
          $installer = Start-Process (Join-Path $env:RUNNER_TEMP 'veo-setup.exe') -ArgumentList '/S',"/D=$install" -PassThru
          if (!$installer.WaitForExit(180000) -or $installer.ExitCode -ne 0) { throw 'Trình cài không hoàn tất' }
          $exe = Get-ChildItem $install -File -Filter '*.exe' | Where-Object { $_.VersionInfo.ProductVersion -match '^0\.3\.17(\.0)?$' } | Select-Object -First 1
          if (!$exe) { throw 'Thiếu ứng dụng đúng phiên bản' }
          if ($exe.VersionInfo.CompanyName -ne 'MSX Tech') { throw 'Sai tên đơn vị phát triển trong ứng dụng Windows' }
          Write-Output 'Thông tin ứng dụng Windows ghi đúng MSX Tech.'
          Add-Type -AssemblyName System.Drawing
          $bitmap = [Drawing.Icon]::ExtractAssociatedIcon($exe.FullName).ToBitmap()
          try {
            $green=0; $yellow=0; $white=0
            for ($x=0; $x -lt $bitmap.Width; $x++) {
              for ($y=0; $y -lt $bitmap.Height; $y++) {
                $pixel=$bitmap.GetPixel($x,$y)
                if ($pixel.A -lt 220) { continue }
                if ($pixel.G -gt ($pixel.R + 40) -and $pixel.G -gt ($pixel.B + 20)) { $green++ }
                if ($pixel.R -gt 220 -and $pixel.G -gt 138 -and $pixel.G -lt 220 -and $pixel.B -lt 95) { $yellow++ }
                if ($pixel.R -gt 230 -and $pixel.G -gt 230 -and $pixel.B -gt 230) { $white++ }
              }
            }
            $area=$bitmap.Width*$bitmap.Height
            if ($green -lt 0.30*$area -or $white -lt 0.12*$area -or $yellow -lt 0.018*$area) { throw 'Biểu tượng Windows sai logo Vèo' }
            Write-Output 'Windows nhận đúng logo Vèo nền xanh, biểu tượng trắng và nét vàng.'
          } finally { $bitmap.Dispose() }
          $testPort = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback,0)
          $testPort.Start()
          $port = $testPort.LocalEndpoint.Port
          $testPort.Stop()
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=$port"
          $app = Start-Process $exe.FullName -PassThru
          $probeLogin = Join-Path $env:RUNNER_TEMP 'kiem-man-dang-nhap.mjs'
          @'
          import assert from 'node:assert/strict';
          const deadline=Date.now()+60000;
          const pause=()=>new Promise(resolve=>setTimeout(resolve,700));
          const expr=`(() => ({
            heading:document.querySelector('h1')?.textContent?.trim(),
            username:!!document.querySelector('input[autocomplete="username"]'),
            password:!!document.querySelector('input[type=password][autocomplete="current-password"]'),
            logo:!!document.querySelector('.d-brand img')?.naturalWidth
          }))()`;
          let ready=false, targets=[], lastState=null, lastError='';
          const proc=Number(process.argv[3]);
          while(Date.now()<deadline && !ready){
            try {
              const pages=await(await fetch('http://127.0.0.1:'+process.argv[2]+'/json/list')).json();
              targets=pages.map(p=>[p.type,p.url?.split(/[?#]/)[0]]);
              const p=pages.find(p=>p.type==='page' && p.url?.includes('tauri')) || pages.find(p=>p.type==='page');
              if(p){
                const ws=new WebSocket(p.webSocketDebuggerUrl);
                try {
                  const r=await new Promise((ok,no)=>{
                    const timer=setTimeout(()=>no(Error('WebView2 timeout')),3500);
                    ws.onopen=()=>ws.send(JSON.stringify({id:1,method:'Runtime.evaluate',params:{expression:expr,returnByValue:true}}));
                    ws.onerror=()=>{clearTimeout(timer);no(Error('WebView2'))};
                    ws.onmessage=e=>{const obj=JSON.parse(e.data);if(obj.id===1){clearTimeout(timer);ok(obj.result?.result?.value)}};
                  });
                  lastState=r;
                  ready=r?.heading==='Đăng nhập' && r.username && r.password && r.logo;
                } finally{ws.close();}
              }
            }catch(e){lastError=e.message + ' ' + (e.cause?.code || '');}
            if(!ready) await pause();
          }
          if(!ready) console.log(JSON.stringify({targets,lastState,lastError,proc}));
          assert.ok(ready,'Bộ cài chưa hiển thị đủ màn đăng nhập MSX và logo');
          console.log('Đã mở màn đăng nhập MSX trong ứng dụng Windows, có hai trường và logo mới.');
          '@ | Set-Content -Encoding utf8 $probeLogin
          Write-Output ("Tiến trình mở: " + $exe.Name + " PID " + $app.Id)
          & (Join-Path $install 'node.exe') $probeLogin $port $app.Id
          if ($LASTEXITCODE -ne 0) {
            Get-Process -Id $app.Id -ErrorAction SilentlyContinue | Select-Object ProcessName,Responding,MainWindowTitle,SessionId | Format-List
            Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Select-Object -First 3 ProcessName,SessionId | Format-Table
            throw 'Màn đăng nhập Windows chưa đạt'
          }
          Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS
          Start-Sleep -Seconds 12
          if ($app.HasExited) { throw 'Ứng dụng thoát sau khi mở' }
          $worker = Join-Path $install 'worker/dung-app.mjs'
          $node = Join-Path $install 'node.exe'
          if (!(Test-Path $node) -or !(Test-Path $worker)) { throw 'Thiếu phần dựng đã cài' }
          foreach ($f in @('ffmpeg','ffprobe')) {
            $versionInfo = & (Join-Path $install "$f.exe") -version
            if ($LASTEXITCODE -ne 0) { throw "Lỗi công cụ $f" }
          }
          & (Join-Path $install 'ffmpeg.exe') -v error -f lavfi -i 'sine=d=0.25:r=48000' -c:a libmp3lame -y (Join-Path $env:RUNNER_TEMP 'thu.mp3')
          if ($LASTEXITCODE -ne 0) { throw 'Bộ cài chưa xuất được MP3' }
          $workerDir = Split-Path $worker
          $probe = Join-Path $env:RUNNER_TEMP 'kiem-mo-hinh.mjs'
          @'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const base = process.argv[2];
          const ort = await import(pathToFileURL(join(base,'node_modules/onnxruntime-web/index.mjs')));
          ort.env.wasm.numThreads = 1;
          const s = await ort.InferenceSession.create(readFileSync(join(base,'models/modnet/model.onnx')));
          const x = new ort.Tensor('float32',new Float32Array(3*512*288),[1,3,512,288]);
          const y = (await s.run({[s.inputNames[0]]:x}))[s.outputNames[0]];
          if(y.data.length!==512*288 || !y.data.every(Number.isFinite)) throw Error('Mat na khong hop le');
          await s.release();
          const face = await ort.InferenceSession.create(readFileSync(join(base,'models/face/model.onnx')),{logSeverityLevel:3});
          const pixels = new ort.Tensor('float32',new Float32Array(3*240*320),[1,3,240,320]);
          const result = await face.run({[face.inputNames[0]]:pixels});
          if(!result.scores?.data.length || !result.boxes?.data.every(Number.isFinite)) throw Error('Bo do mat chua san sang');
          await face.release();
          for (const model of ['spleeter/vocals.fp16.onnx','spleeter/accompaniment.fp16.onnx','silero-vad/silero_vad.onnx']) {
            const session=await ort.InferenceSession.create(readFileSync(join(base,'models',model)));
            const t=(xs,shape)=>new ort.Tensor('float32',new Float32Array(xs),shape);
            const feeds=model.startsWith('silero') ? {input:t(576,[1,576]),state:t(256,[2,1,128]),sr:new ort.Tensor('int64',BigInt64Array.of(16000n),[])} : {[session.inputNames[0]]:t(1048576,[2,1,512,1024])};
            const out=(await session.run(feeds))[session.outputNames[0]].data;
            if(!out.length || !out.every(Number.isFinite)) throw Error(model);
            await session.release();
          }
          console.log('Windows da tinh mat na va phan tich khuon mat bang CPU.');
          '@ | Set-Content -Encoding utf8 $probe
          & $node $probe $workerDir
          if ($LASTEXITCODE -ne 0) { throw 'Lỗi mô hình trong bộ cài' }
          $p = [Diagnostics.ProcessStartInfo]::new($node)
          $p.ArgumentList.Add($worker)
          $p.UseShellExecute = $false
          $p.RedirectStandardOutput = $true
          $p.RedirectStandardInput = $true
          $p.Environment['DUNG_DATA'] = Join-Path $env:RUNNER_TEMP 'du-an-thu'
          $child = [Diagnostics.Process]::Start($p)
          try {
            $read = $child.StandardOutput.ReadLineAsync()
            if (!$read.Wait(45000)) { throw 'Phần dựng chưa sẵn sàng' }
            $boot = $read.Result | ConvertFrom-Json
            if (!$boot.port -or !$boot.token) { throw 'Phần dựng chưa khởi động' }
            $state = Invoke-RestMethod ("http://127.0.0.1:{0}/api/state?t={1}" -f $boot.port,$boot.token)
            if ($null -eq $state) { throw 'Thiếu trạng thái ứng dụng' }
            Write-Output "Đã cài và mở Vèo $($exe.VersionInfo.ProductVersion), phần dựng trả trạng thái."
          } finally {
            if (!$child.HasExited) { $child.Kill($true) }
            if (!$app.HasExited) { $app.Kill($true) }
          }
