name: Kiểm chỉnh video qua hai CLI trực tiếp trên Vèo Windows r28
on:
  push:
    branches: [kiem-veo-r27-ai-truc-tiep-windows]
permissions:
  contents: read
jobs:
  do:
    runs-on: windows-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - name: Cài đúng Vèo Windows r28
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-ai-r28'
          $Tag = 'veo-qa-windows-20261126-7bc6cdf'
          $Name = 'Veo-Windows-Signed-Flow-QA_0.3.24_x64-setup-r28.exe'
          if ((gh release view $Tag -R $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft) -ne 'true') { throw 'Không thấy bản nháp kiểm thử.' }
          gh release download $Tag -R $env:GITHUB_REPOSITORY --dir $Qa --pattern $Name
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash (Join-Path $Qa $Name)).Hash -ne '21beecfc4f8fab96737b9cadad4c732da8c4099491d216409b5e4a738a25f4c3') { throw 'Sai bộ cài thử.' }
          $Install = Join-Path $Qa 'app'
          if ($env:GITHUB_ACTIONS -ne 'true' -or (Test-Path $Install)) { throw 'Cần máy thử có thư mục cài trống.' }
          $Process = Start-Process (Join-Path $Qa $Name) -ArgumentList @('/S',"/D=$Install") -PassThru
          if (!$Process.WaitForExit(240000)) { $Process.Kill($true); throw 'Cài Vèo quá thời gian.' }
          if ($Process.ExitCode -ne 0 -or (Get-Item (Join-Path $Install 'msx-phong-dung.exe')).VersionInfo.FileVersion -notmatch '^0\.3\.24(\.0)?$') { throw 'Sai phiên bản đã cài.' }
      - name: Chọn nguồn, nhắn cắt và đối chiếu MP4 trên bộ cài
        shell: pwsh
        run: |
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-ai-r28'
          $Install = Join-Path $Qa 'app'
          $env:VEO_QA_WORKER_SHA = (Get-FileHash (Join-Path $Install 'worker/dung-app.mjs')).Hash.ToLowerInvariant()
          if ($env:VEO_QA_WORKER_SHA -ne '6759192f1b32e0329fe95bfe29f4b2d06d8c6dd516a73a66ccaafea518d57258') { throw 'Sai mã phần dựng.' }
          $env:VEO_QA_SOURCE = 'acfa5055b2ae3877fa69bc6c24fc49af893a74dd'
          $env:VEO_QA_OS = (Get-CimInstance Win32_OperatingSystem).Caption
          $Data = Join-Path $env:APPDATA 'vn.msxgroup.phongdung'
          if (Test-Path $Data) { throw 'Cần máy thử có kho trống.' }
          $env:DUNG_CHEP_LOI = 'may'
          $env:NO_PROXY = '127.0.0.1,localhost'
          $Script = Join-Path $Qa 'kiem-ai-truc-tiep-r27.ps1'
          Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/scripts/windows/kiem-ai-truc-tiep-r27.ps1" -OutFile $Script
          Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/scripts/windows/cli-thu-veo.cs" -OutFile (Join-Path $Qa 'cli-thu-veo.cs')
          & pwsh -NoProfile -STA -File $Script -Install $Install -Qa $Qa
          if ($LASTEXITCODE -ne 0) { throw 'Ca kiểm hai CLI trực tiếp thất bại.' }
      - name: Lưu ảnh, hai lượt CLI và MP4
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-r28-ai-truc-tiep-windows
          path: ${{ runner.temp }}/veo-qa-ai-r28/minh-chung
          if-no-files-found: warn
          retention-days: 30
