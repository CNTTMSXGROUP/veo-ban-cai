name: Đưa clip gốc vào bản sao Drive qua Vèo Mac r27
on:
  push:
    branches: [kiem-veo-r27-drive-hai-may]
permissions:
  contents: read
jobs:
  gui:
    runs-on: macos-26
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Đưa bản dựng và clip gốc vào thư mục thử bằng Vèo Mac
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/veo-qa-mac-cua-so"
          mkdir -p "$qa"
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/mac"
          for tep in bam-cua-so.swift kiem-drive-r27-mac.sh; do
            curl -fsSL --retry 2 --max-time 30 "$base/$tep" -o "$qa/$tep"
          done
          bash "$qa/kiem-drive-r27-mac.sh" "$qa" ce68a23a8449b6cce1cb6d96286627c960a5e0638e8d8880ba4b02a56e370008
      - name: Lưu thư mục chuyển và ảnh máy gửi
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-r27-drive-mac
          path: ${{ runner.temp }}/veo-qa-mac-cua-so/minh-chung
          if-no-files-found: warn
          retention-days: 30
