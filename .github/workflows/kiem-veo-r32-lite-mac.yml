name: Kiểm Veo 3.1 Lite trên Vèo Mac r32
on:
  push:
    branches: [kiem-veo-r32-lite-mac]
permissions:
  contents: read
jobs:
  do:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            chip: arm64
            dmg_sha: ed06dce95a1baad051b653157f5966f469da2c217ebe1c6aaa4f11dd5f7448e5
          - runner: macos-15-intel
            chip: x64
            dmg_sha: d96aacbd13237906b3347ff47a5bac61d04687fc52116c3dfe7fc5847c365a9b
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Cài Vèo rồi tạo và phát lại clip Veo Lite bằng giao diện
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VEO_QA_DMG_SHA: ${{ matrix.dmg_sha }}
          VEO_QA_REVISION: r32
          VEO_QA_WORKER_SHA: 70930267c689bc91a09f31db2435e848d46b9f509360b85eef4046c7fd04ba54
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/veo-qa-mac-lite"
          mkdir -p "$qa"
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/mac"
          for tep in bam-cua-so.swift kiem-cua-so-r31.sh kiem-veo-lite-r32.sh veo-lite-cloud-thu.cjs; do
            curl -fsSL --retry 2 --max-time 30 "$base/$tep" -o "$qa/$tep"
          done
          bash "$qa/kiem-cua-so-r31.sh" "$qa" "$VEO_QA_DMG_SHA"
      - name: Lưu ảnh, video và kết quả
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-r32-lite-mac-${{ matrix.chip }}
          path: ${{ runner.temp }}/veo-qa-mac-lite/minh-chung
          if-no-files-found: warn
          retention-days: 30
