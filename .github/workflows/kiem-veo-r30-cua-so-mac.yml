name: Kiểm storyboard, hoàn tác và phát lại trên Vèo Mac r30
on:
  push:
    branches: [kiem-veo-r30-cua-so-mac]
permissions:
  contents: read
jobs:
  ve-o:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            chip: x64
            dmg_sha: f904558aaa88ab2bd8341646cf2157fddd02222f045982fb5c45d92bb46926e3
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Cài Vèo, tạo storyboard bằng chuột và phím, hoàn tác rồi mở lại MP4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VEO_QA_DMG_SHA: ${{ matrix.dmg_sha }}
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/veo-qa-mac-cua-so"
          mkdir -p "$qa"
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/mac"
          for tep in bam-cua-so.swift kiem-cua-so-r30.sh; do
            curl -fsSL --retry 2 --max-time 30 "$base/$tep" -o "$qa/$tep"
          done
          bash "$qa/kiem-cua-so-r30.sh" "$qa" "$VEO_QA_DMG_SHA"
      - name: Lưu ảnh, video và kết quả
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-mac-${{ matrix.chip }}-r30
          path: ${{ runner.temp }}/veo-qa-mac-cua-so/minh-chung
          if-no-files-found: warn
          retention-days: 30
