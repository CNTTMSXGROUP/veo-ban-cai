name: Kiểm cài mới Vèo thử trên Windows
on:
  push:
    branches: [kiem-veo-qa-win-20261126-7bc6cdf]
permissions:
  contents: read
jobs:
  cai-va-dung:
    runs-on: windows-latest
    timeout-minutes: 14
    permissions:
      contents: write
    steps:
      - name: Lấy đúng hai tệp của bản nháp
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Dir = Join-Path $env:RUNNER_TEMP 'veo-qa'
          New-Item -ItemType Directory -Path $Dir | Out-Null
          $Tag = 'veo-qa-windows-20261126-7bc6cdf'
          $AppName = 'Veo-QA-Windows-26_0.3.24_x64-setup.exe'
          $Renderer = 'render-hyperframes-win32-x64-2d1477237512.tar.gz'
          $IsDraft = gh release view $Tag -R $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $IsDraft -ne 'true') { throw 'Không thấy bản nháp dùng để kiểm.' }
          gh release download $Tag -R $env:GITHUB_REPOSITORY --pattern $AppName --pattern $Renderer --dir $Dir
          if ($LASTEXITCODE -ne 0) { throw 'Không tải được bộ cài hoặc gói đồ họa.' }
          if ((Get-FileHash (Join-Path $Dir $AppName)).Hash -ne '7bc6cdfc88bd29e1ddf4be5914f4960362af3b5b62cd5519fce6b8ce07f6462d') { throw 'Sai SHA-256 của bộ cài.' }
          if ((Get-FileHash (Join-Path $Dir $Renderer)).Hash -ne '2d1477237512e6872bb98096e39563a3ad16a04a8f7bb1d25112c7df1274b208') { throw 'Sai SHA-256 của gói đồ họa.' }
      - name: Cài vào thư mục riêng và kiểm app đã cài
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Dir = Join-Path $env:RUNNER_TEMP 'veo-qa'
          $Setup = Join-Path $Dir 'Veo-QA-Windows-26_0.3.24_x64-setup.exe'
          $Install = Join-Path $Dir 'Vèo thử Windows'
          $Installer = Start-Process $Setup -ArgumentList '/S',"/D=$Install" -PassThru
          if (!$Installer.WaitForExit(240000)) { $Installer.Kill($true); throw 'Cài NSIS quá thời gian.' }
          if ($Installer.ExitCode -ne 0) { throw "Cài NSIS lỗi $($Installer.ExitCode)." }
          $Os = Get-CimInstance Win32_OperatingSystem
          Write-Host "$($Os.Caption) $($Os.OSArchitecture) $($Os.Version)"
          Write-Host "Đã cài NSIS vào thư mục riêng."
          $Renderer = Join-Path $Dir 'render-hyperframes-win32-x64-2d1477237512.tar.gz'
          tar.exe -xzf $Renderer -C $Dir
          if ($LASTEXITCODE -ne 0) { throw 'Không mở được gói đồ họa.' }
          $env:DUNG_HYPERFRAMES_DIR = Join-Path $Dir 'render-hyperframes'
          $Smoke = Join-Path $Dir 'smoke-packaged.ps1'
          Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/scripts/windows/smoke-packaged.ps1" -OutFile $Smoke
          & $Smoke -InstallDir $Install -Version '0.3.24' -OpenApp
