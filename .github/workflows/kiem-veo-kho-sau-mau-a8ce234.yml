name: Kiểm sáu mẫu Kho phong cách trên Vèo Windows và Mac Intel
on:
  push:
    branches: [kiem-veo-kho-sau-mau-a8ce234]
permissions:
  contents: read
jobs:
  kho-windows:
    runs-on: windows-latest
    timeout-minutes: 16
    permissions:
      contents: write
    steps:
      - name: Lấy đúng bộ cài thử từ bản nháp
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-kho-sau-mau'
          $Tag = 'veo-qa-windows-20261126-7bc6cdf'
          $Name = 'Veo-Windows-Signed-Flow-QA_0.3.24_x64-setup-r19.exe'
          $IsDraft = gh release view $Tag -R $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $IsDraft -ne 'true') { throw 'Không thấy bản nháp kiểm thử.' }
          gh release download $Tag -R $env:GITHUB_REPOSITORY --dir $Qa --pattern $Name
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash (Join-Path $Qa $Name)).Hash -ne '2a29bd0c9ed8acb6e80b2e5ae0aca79542d18ca0e3ce9928e14226e0642c1b7f') {
            throw 'Không lấy được đúng bộ cài thử.'
          }
      - name: Cài Vèo, tạo và dựng video theo sáu mẫu
        shell: pwsh
        run: |
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-kho-sau-mau'
          $Install = Join-Path $Qa 'app'
          if ($env:GITHUB_ACTIONS -ne 'true' -or (Test-Path $Install)) { throw 'Cần máy thử có thư mục cài trống.' }
          $Installer = Join-Path $Qa 'Veo-Windows-Signed-Flow-QA_0.3.24_x64-setup-r19.exe'
          $Process = Start-Process $Installer -ArgumentList @('/S',"/D=$Install") -PassThru
          if (!$Process.WaitForExit(240000)) { $Process.Kill($true); throw 'Cài Vèo quá thời gian.' }
          if ($Process.ExitCode -ne 0 -or (Get-Item (Join-Path $Install 'msx-phong-dung.exe')).VersionInfo.FileVersion -notmatch '^0\.3\.24(\.0)?$') { throw 'Sai phiên bản đã cài.' }
          $env:VEO_QA_WORKER_SHA = (Get-FileHash (Join-Path $Install 'worker/dung-app.mjs')).Hash.ToLowerInvariant()
          if ($env:VEO_QA_WORKER_SHA -ne 'd100e23edda07c5a7d42c0c2025cf621eea977fc184076388fa402976d7aec29') { throw 'Sai mã phần dựng.' }
          $env:VEO_QA_SOURCE = 'a8ce2349f19b342fec6f018325bec950b5353f48'
          $env:VEO_QA_OS = (Get-CimInstance Win32_OperatingSystem).Caption
          $env:VEO_QA_PYTHON = (Get-Command python.exe -ErrorAction Stop).Source
          $env:PYTHONUTF8 = '1'
          foreach ($File in @('chay-kiem-kho.mjs','kiem-kho.py')) {
            Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/scripts/windows/$File" -OutFile (Join-Path $Qa $File)
          }
          & (Join-Path $Install 'node.exe') (Join-Path $Qa 'chay-kiem-kho.mjs') $Install $Qa
          if ($LASTEXITCODE -ne 0) { throw 'Ca kiểm Kho phong cách thất bại.' }
      - name: Lưu video và kết quả kiểm
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-kho-sau-mau-windows-a8ce234
          path: ${{ runner.temp }}/veo-qa-kho-sau-mau/minh-chung
          if-no-files-found: warn
          retention-days: 30
  kho-intel:
    runs-on: macos-15-intel
    timeout-minutes: 14
    permissions:
      contents: write
    steps:
      - name: Mở bản thử Intel, tạo và dựng video theo sáu mẫu
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          qa="$RUNNER_TEMP/veo-qa-kho-sau-mau"
          mkdir -p "$qa/gan" "$qa/runtime"
          cd "$qa"
          tag=veo-qa-mac-intel-20261126
          dmg=Veo-QA-mac-x64_0.3.24-r18.dmg
          ffmpeg=ffmpeg-darwin-x64-8a804cebf686.tar.gz
          node=node-darwin-x64-4e7afae035ab.tar.gz
          canvas=ve-chu-darwin-x64-37861a187c68.tar.gz
          test "$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern "$dmg" --pattern "$ffmpeg"
          for pkg in "$node" "$canvas"; do
            curl -fLsS --retry 2 "https://github.com/$GITHUB_REPOSITORY/releases/download/phan-chay/$pkg" -o "$pkg"
          done
          printf '%s\n' \
            "0eb1493281e916eae1177f3db9118af8662bbbdf655283b17e2ec677838f2bf7  $dmg" \
            "8a804cebf686b809a5ea0d6f5f02aa34b7ca5b6dcef2b890b26bbd0d8ef1d63f  $ffmpeg" \
            "4e7afae035ab35edbea161ec518a1a13a4c7658573a29406dc5741934e8ad53e  $node" \
            "37861a187c689d33f571bb7cf350ce641615a2974b13f0794e110068af7c00c7  $canvas" | shasum -a 256 -c
          hdiutil attach "$dmg" -mountpoint "$qa/gan" -readonly -nobrowse -noautoopen
          trap 'hdiutil detach "$qa/gan"' EXIT
          app="$qa/gan/Veo QA Intel 26.app"
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/msx-phong-dung" -verify_arch x86_64
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist" | grep -x '0.3.24'
          resources="$app/Contents/Resources"
          export VEO_QA_SOURCE=a8ce2349f19b342fec6f018325bec950b5353f48
          export VEO_QA_WORKER_SHA="$(shasum -a 256 "$resources/worker/dung-app.mjs" | awk '{print $1}')"
          test "$VEO_QA_WORKER_SHA" = d100e23edda07c5a7d42c0c2025cf621eea977fc184076388fa402976d7aec29
          export VEO_QA_OS="macOS $(sw_vers -productVersion) · $(sysctl -n machdep.cpu.brand_string)"
          tar -xzf "$node" -C "$qa/runtime"
          tar -xzf "$canvas" -C "$qa/runtime"
          tar -xzf "$ffmpeg" -C "$qa/runtime"
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts"
          curl -fsS --retry 2 "$base/windows/kiem-kho.py" -o kiem-kho.py
          curl -fsS --retry 2 "$base/mac/chay-kiem-kho.py" -o chay-kiem-kho.py
          python3 chay-kiem-kho.py "$resources" "$qa/runtime" "$qa"
      - name: Lưu video và kết quả Intel
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-kho-sau-mau-intel-a8ce234
          path: ${{ runner.temp }}/veo-qa-kho-sau-mau/minh-chung
          if-no-files-found: warn
          retention-days: 30
