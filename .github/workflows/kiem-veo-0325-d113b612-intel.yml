name: Kiểm Vèo 0.3.25 trên Mac Intel
on:
  push:
    branches: [kiem-veo-0325-d113b612]
    paths: [.github/workflows/kiem-veo-0325-d113b612-intel.yml]
permissions:
  contents: write
jobs:
  mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 22
    steps:
      - name: Cài đè, mở Vèo, xuất và phát lại từ kho cũ
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VEO_QA_WORKER_SHA: 3535893d20fa23e847cb9b59c84f9fa72ef302115f3eb8a15390a9abab61fc10
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/veo-qa-mac-cap-nhat"
          mkdir -p "$qa/cu" "$qa/moi"
          cd "$qa"
          ten_cu=Veo_0.3.24_x64.app.tar.gz; ten_moi=Veo_0.3.25_x64.app.tar.gz
          gh release download v0.3.24 -R "$GITHUB_REPOSITORY" --dir cu --pattern "$ten_cu"
          gh release download v0.3.25 -R "$GITHUB_REPOSITORY" --dir moi --pattern "$ten_moi"
          gh release download veo-qa-windows-20261126-7bc6cdf -R "$GITHUB_REPOSITORY" --pattern qa-upgrade-voice.mp4
          printf '%s\n' "7109962c26053804cbf8c6b9a989f2f06211d5311caa0d0486d40624077cdf97  cu/$ten_cu" "ff6512986b7d3aae396587b6cd90c1696dc7d611c11370c8c32454764007ebca  moi/$ten_moi" '4c99742130fb5cecd2f8f5ad7c8c3f718b11ea668b4e93ff9b2ac971606cff71  qa-upgrade-voice.mp4' | shasum -a 256 -c
          curl -fLsS --max-time 140 --retry 2 'https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.en-q5_1.bin?download=true' -o ggml-base.en-q5_1.bin
          printf '%s\n' '4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f  ggml-base.en-q5_1.bin' | shasum -a 256 -c
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/mac"
          curl -fsSL --retry 2 --max-time 30 "$base/bam-cua-so-nang-cap-intel.swift" -o "$qa/bam-cua-so.swift"
          curl -fsSL --retry 2 --max-time 30 "$base/kiem-nang-cap-chinh-intel.sh" -o "$qa/kiem-nang-cap-chinh.sh"
          curl -fsSL --retry 2 --max-time 30 "$base/tao-kho-0323.mjs" -o "$qa/tao-kho-0323.mjs"
          bash "$qa/kiem-nang-cap-chinh.sh" "$qa" "$qa/cu/$ten_cu" "$qa/moi/$ten_moi" thay
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-0325-mac-intel-d113b612
          path: ${{ runner.temp }}/veo-qa-mac-cap-nhat/minh-chung
          if-no-files-found: warn
          retention-days: 30
