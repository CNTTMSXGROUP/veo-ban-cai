name: Kiểm Sửa tay trên bộ cài Vèo 0.3.24
on:
  push:
    branches: [kiem-veo-0324-sua-tay]
permissions:
  contents: write
env:
  TAG: veo-qa-0324-ban-chinh-2
  VEO_QA_WORKER_SHA: 'f849747a27443d3fd8ee906c5eba16fae82723c8fa753524a42d1c8dc2595941'
jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Xuất vùng làm mờ rồi thao tác chuột trên bản cài
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/veo-qa-sua-tay"
          mkdir -p "$qa"
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts"
          for tep in mac/bam-cua-so.swift mac/lai-app-mac.swift mac/kiem-sua-tay.sh do-hoa/tao-sua-tay.mjs; do
            curl -fsSL --retry 2 --max-time 30 "$base/$tep" -o "$qa/${tep##*/}"
          done
          bash "$qa/kiem-sua-tay.sh" "$qa" cfac780ac4c1643b31629b1ac7b175c072510e0f093b5cc3263bca51c676e2f4
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sua-tay-mac
          path: ${{ runner.temp }}/veo-qa-sua-tay/minh-chung
          if-no-files-found: warn
          retention-days: 30
  windows:
    runs-on: windows-latest
    timeout-minutes: 16
    steps:
      - name: Xuất vùng làm mờ bằng bản cài Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-sua-tay'
          New-Item -ItemType Directory -Path $Qa | Out-Null
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY --dir $Qa --pattern Veo_0.3.24_x64-setup.exe
          if ((Get-FileHash (Join-Path $Qa 'Veo_0.3.24_x64-setup.exe')).Hash -ne '1df366af3aa84f7847f45ed37fadb18dba4560442815363a591cf387c0b4d49a') { throw 'Sai bộ cài.' }
          $Install = Join-Path $Qa 'app'
          $Process = Start-Process (Join-Path $Qa 'Veo_0.3.24_x64-setup.exe') -ArgumentList @('/S',"/D=$Install") -PassThru
          if (!$Process.WaitForExit(240000)) { $Process.Kill($true); throw 'Cài Vèo quá thời gian.' }
          if ((Get-FileHash (Join-Path $Install 'worker/dung-app.mjs')).Hash -ne $env:VEO_QA_WORKER_SHA) { throw 'Sai mã phần dựng.' }
          $Model = Join-Path $Qa 'ggml-base.en-q5_1.bin'
          curl.exe -fLsS --max-time 140 --retry 2 'https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base.en-q5_1.bin?download=true' -o $Model
          if ((Get-FileHash $Model).Hash -ne '4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f') { throw 'Sai mô hình.' }
          gh release download veo-qa-windows-20261126-7bc6cdf -R $env:GITHUB_REPOSITORY --dir $Qa --pattern qa-upgrade-voice.mp4
          if ((Get-FileHash (Join-Path $Qa 'qa-upgrade-voice.mp4')).Hash -ne '4c99742130fb5cecd2f8f5ad7c8c3f718b11ea668b4e93ff9b2ac971606cff71') { throw 'Sai tiếng nguồn.' }
          $Script = Join-Path $Qa 'tao-sua-tay.mjs'
          Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/scripts/do-hoa/tao-sua-tay.mjs" -OutFile $Script
          $env:VEO_QA_DATA = Join-Path $Qa 'kho-thu'
          $env:VEO_QA_CLIP = Join-Path $Qa 'qa-upgrade-voice.mp4'
          $env:VEO_QA_MODEL = $Model
          & (Join-Path $Install 'node.exe') $Script $Install (Join-Path $Install 'worker') $Qa
          if ($LASTEXITCODE -ne 0) { throw 'Ca xuất vùng làm mờ trên Windows thất bại.' }
          # Dò riêng, không chặn: thư mục kho có chữ tiếng Việt thì bộ chép lời trên Windows có chạy được không.
          $QaDau = Join-Path $Qa 'co-dau'
          New-Item -ItemType Directory -Path $QaDau | Out-Null
          $env:VEO_QA_DATA = Join-Path $QaDau 'Kho thử'
          & (Join-Path $Install 'node.exe') $Script $Install (Join-Path $Install 'worker') $QaDau
          "Kho có dấu: mã thoát $LASTEXITCODE" | Tee-Object -FilePath (Join-Path $Qa 'minh-chung/kho-co-dau.txt')
          $global:LASTEXITCODE = 0
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sua-tay-windows
          path: ${{ runner.temp }}/veo-qa-sua-tay/minh-chung
          if-no-files-found: warn
          retention-days: 30
