name: Kiểm bộ cài Vèo 0.3.24 trên macOS Intel
on:
  push:
    branches: [kiem-veo-mac-intel-20261126]
permissions:
  contents: read
jobs:
  cai-dung-xuat:
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Kiểm kiến trúc và tải DMG cùng gói phần chạy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          sysctl -n machdep.cpu.brand_string | grep -i Intel
          sw_vers
          qa="$RUNNER_TEMP/veo-intel-r7"
          mkdir -p "$qa/runtime"
          tag='veo-qa-mac-intel-20261126'
          test "$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --dir "$qa" --pattern 'Veo-QA-mac-x64_0.3.24-r7.dmg'
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --dir "$qa/runtime" \
            --pattern 'ffmpeg-darwin-x64-8a804cebf686.tar.gz' \
            --pattern 'render-hyperframes-darwin-x64-b1e7e958e6de.tar.gz'
          python3 - "$qa/runtime" <<'PYFETCH'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import hashlib,json,subprocess,sys
          root=Path(sys.argv[1])
          public='https://github.com/CNTTMSXGROUP/veo-ban-cai/releases/download/phan-chay/'
          packs=json.loads('[["node-darwin-x64-4e7afae035ab.tar.gz","4e7afae035ab35edbea161ec518a1a13a4c7658573a29406dc5741934e8ad53e"],["whisper-darwin-x64-ca44a0ecf10a.tar.gz","ca44a0ecf10a0dc7d0cb09f6181abfefaaa881cc8e6295a8e1ff47096aa704f1"],["loc-on-darwin-x64-12d44c5b5ff2.tar.gz","12d44c5b5ff234cd2bf1f1f034c6dce18fc61db94bfed03923e06650aa6aed56"],["ve-chu-darwin-x64-37861a187c68.tar.gz","37861a187c689d33f571bb7cf350ce641615a2974b13f0794e110068af7c00c7"],["chan-dung-darwin-x64-84b9ce4b9522.tar.gz","84b9ce4b952239d8e4bfe293105abb164eb637d4cbe32abaa88870289e26e99a"],["tieng-dong-darwin-x64-f2d054f2a5f4.tar.gz","f2d054f2a5f4abc656f01a6b497ebe5b97eeed1519eb586b20fd7c25daa84a2c"]]')
          def get(pair):
              name,sha=pair
              target=root/name
              subprocess.run(['curl','-fsSL','--retry','2','--max-time','110',public+name,'-o',str(target)],check=True)
              with target.open('rb') as f:
                  assert hashlib.file_digest(f,'sha256').hexdigest()==sha,name
              print(name,flush=True)
          with ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(get,packs))
          PYFETCH
          cd "$qa"
          printf '%s\n' \
            '3b4e71a392b2fee1980dbd9adea5cf2c1f4848efa3eed183fc40856ba7865d07  Veo-QA-mac-x64_0.3.24-r7.dmg' \
            '8a804cebf686b809a5ea0d6f5f02aa34b7ca5b6dcef2b890b26bbd0d8ef1d63f  runtime/ffmpeg-darwin-x64-8a804cebf686.tar.gz' \
            'b1e7e958e6de9cdecf15cfc4ffdc4b99f625fd8cf11378aec3c741bb56ffe0b5  runtime/render-hyperframes-darwin-x64-b1e7e958e6de.tar.gz' | shasum -a 256 -c
      - name: Cài máy trống, thử lại đổi khung, dựng và xuất
        shell: bash
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/veo-intel-r7"
          curl -fsS --retry 2 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/mac/kiem-ban-thu.py" -o "$qa/kiem-ban-thu.py"
          python3 "$qa/kiem-ban-thu.py" "$qa" x64
          jq -e '.host=="x86_64" and .motion and .warm.bytes==0 and .sourceWorkerSha256=="ab9c2274cc97d2d765b14aaf8b22634034ac1a954a9fb4adf4cef839caf7ae1c"' "$qa/minh-chung/ket-qua.json"
      - name: Xem log của ứng dụng thử
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for log in "$RUNNER_TEMP"/veo-intel-r7/app-*.log; do tail -20 "$log"; done
          worker="$HOME/Library/Logs/vn.msxgroup.phongdung.qa.intel20261126r5/phan-dung.log"
          if [ -f "$worker" ]; then tail -20 "$worker"; fi
      - name: Lưu MP4 tổng hợp và báo cáo kiểm thử
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-mac-intel-r7
          path: ${{ runner.temp }}/veo-intel-r7/minh-chung
          if-no-files-found: error
          retention-days: 30
