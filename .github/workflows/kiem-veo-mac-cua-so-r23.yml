name: Kiểm tạo và xuất video trên Vèo Mac Intel r23
on:
  push:
    branches: [kiem-veo-mac-cua-so-r23]
permissions:
  contents: read
jobs:
  ve-o-intel:
    runs-on: macos-15-intel
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Cài Vèo, tạo storyboard bằng chuột và phím rồi mở lại MP4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/veo-qa-mac-cua-so"
          mkdir -p "$qa"
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/mac"
          for tep in bam-cua-so.swift kiem-cua-so-r23.sh; do
            curl -fsSL --retry 2 --max-time 30 "$base/$tep" -o "$qa/$tep"
          done
          bash "$qa/kiem-cua-so-r23.sh" "$qa" 77b7b75fe0520d11060916e382c0b8f4ec206558417df36f55eb445c57b2c781
      - name: Lưu ảnh, video và kết quả
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-cua-so-intel-r23
          path: ${{ runner.temp }}/veo-qa-mac-cua-so/minh-chung
          if-no-files-found: warn
          retention-days: 30
