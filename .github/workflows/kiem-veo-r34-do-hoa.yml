name: Đo phần dựng đồ họa trong Vèo Intel r37
on:
  push:
    branches: [kiem-veo-r37-intel-lai]
permissions:
  contents: read
jobs:
  mac:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            chip: x64
            revision: r37
            dmg: dbbedbb051d0b0c6042c26b08c6118648fcb961f5feaa44c0d21545953fdef6c
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - name: Cài DMG, tải gói khi cần, xuất và phát lại MP4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VEO_QA_REVISION: ${{ matrix.revision }}
          VEO_QA_WORKER_SHA: 4504cac491ba31a02bc0ef8b7b3fe58e831a9c17a0102cf98592b5547ef7d0ec
          VEO_QA_DMG_SHA: ${{ matrix.dmg }}
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/veo-qa-do-hoa"
          mkdir -p "$qa"
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts"
          for tep in mac/bam-cua-so.swift mac/kiem-do-hoa-r34.sh do-hoa/kiem-video-do-hoa.py; do
            curl -fsSL --retry 2 --max-time 30 "$base/$tep" -o "$qa/${tep##*/}"
          done
          bash "$qa/kiem-do-hoa-r34.sh" "$qa" "$VEO_QA_DMG_SHA"
      - name: Lưu bằng chứng từ cửa sổ Mac
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-do-hoa-mac-intel-lai
          path: ${{ runner.temp }}/veo-qa-do-hoa/minh-chung
          if-no-files-found: warn
          retention-days: 30
