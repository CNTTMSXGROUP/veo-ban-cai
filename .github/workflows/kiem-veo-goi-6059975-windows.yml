name: Kiểm tạo và bàn giao video với Vèo 0.3.24 trên Windows
on:
  push:
    branches: [kiem-veo-goi-6059975-windows]
permissions:
  contents: read
jobs:
  giong-windows:
    runs-on: windows-latest
    timeout-minutes: 16
    permissions:
      contents: write
    steps:
      - name: Lấy đúng bộ cài thử từ bản nháp
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-giong'
          $Tag = 'veo-qa-windows-20261126-7bc6cdf'
          $Name = 'Veo-Windows-Signed-Flow-QA_0.3.24_x64-setup-r18.exe'
          $IsDraft = gh release view $Tag -R $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $IsDraft -ne 'true') { throw 'Không thấy bản nháp kiểm thử.' }
          gh release download $Tag -R $env:GITHUB_REPOSITORY --dir $Qa --pattern $Name
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash (Join-Path $Qa $Name)).Hash -ne '1002ef43b0e82c8581807adc8a32e6e1f1cefa027ea8233d629604500a426069') {
            throw 'Không lấy được đúng bộ cài thử.'
          }
      - name: Kiểm hai phong cách và xuất MP4, FCPXML, OTIO từ phần dựng đã cài
        shell: pwsh
        run: |
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-giong'
          $Install = Join-Path $Qa 'app'
          if ($env:GITHUB_ACTIONS -ne 'true' -or (Test-Path $Install)) { throw 'Cần máy thử có thư mục cài trống.' }
          $Installer = Join-Path $Qa 'Veo-Windows-Signed-Flow-QA_0.3.24_x64-setup-r18.exe'
          $Process = Start-Process $Installer -ArgumentList @('/S',"/D=$Install") -PassThru
          if (!$Process.WaitForExit(240000)) { $Process.Kill($true); throw 'Cài Vèo quá thời gian.' }
          if ($Process.ExitCode -ne 0 -or (Get-Item (Join-Path $Install 'msx-phong-dung.exe')).VersionInfo.FileVersion -notmatch '^0\.3\.24(\.0)?$') { throw 'Sai phiên bản đã cài.' }
          $env:VEO_QA_WORKER_SHA = (Get-FileHash (Join-Path $Install 'worker/dung-app.mjs')).Hash.ToLowerInvariant()
          if ($env:VEO_QA_WORKER_SHA -ne 'c3017c049887bf6fea44a0f109eefdd4ea5ef7a51b693ea18e0aac29bdbf56ab') { throw 'Sai mã phần dựng.' }
          $env:VEO_QA_SOURCE = '6059975c4ca17b019562e5d4ce63a0384863a58c'
          $env:VEO_QA_OS = (Get-CimInstance Win32_OperatingSystem).Caption
          $Script = Join-Path $Qa 'kiem-giong-storyboard.mjs'
          Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/scripts/windows/kiem-giong-storyboard.mjs" -OutFile $Script
          $Timecode = Join-Path $Qa 'kiem-timecode.py'
          Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/scripts/windows/kiem-timecode.py" -OutFile $Timecode
          $env:VEO_QA_PYTHON = (Get-Command python.exe -ErrorAction Stop).Source
          $env:PYTHONUTF8 = '1'
          & (Join-Path $Install 'node.exe') $Script $Install $Qa
          if ($LASTEXITCODE -ne 0) { throw 'Ca lời đọc hoặc dựng storyboard chưa đạt.' }
      - name: Tạo và xuất storyboard có lời đọc trong cửa sổ Vèo đã cài
        shell: pwsh
        run: |
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-giong'
          $Install = Join-Path $Qa 'app'
          $env:VEO_QA_SOURCE = '6059975c4ca17b019562e5d4ce63a0384863a58c'
          $env:VEO_QA_WORKER_SHA = (Get-FileHash (Join-Path $Install 'worker/dung-app.mjs')).Hash.ToLowerInvariant()
          $env:VEO_QA_OS = (Get-CimInstance Win32_OperatingSystem).Caption
          $env:DUNG_CHEP_LOI = 'may'
          $env:NO_PROXY = '127.0.0.1,localhost'
          $Script = Join-Path $Qa 'kiem-tao-video-tu-loi-doc.ps1'
          Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/scripts/windows/kiem-tao-video-tu-loi-doc.ps1" -OutFile $Script
          & pwsh -NoProfile -STA -File $Script -Install $Install -Qa $Qa
          if ($LASTEXITCODE -ne 0) { throw 'Ca tạo storyboard trong cửa sổ Vèo thất bại.' }
      - name: Lưu hình, video và bản nháp
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-windows-goi-6059975
          path: ${{ runner.temp }}/veo-qa-giong/minh-chung
          if-no-files-found: error
          retention-days: 30
