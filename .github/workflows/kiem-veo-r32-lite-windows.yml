name: Kiểm ngân sách và tải lại Veo 3.1 Lite trên Windows r32
on:
  push:
    branches: [kiem-veo-r32-lite-windows]
permissions:
  contents: read
jobs:
  do:
    runs-on: windows-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - name: Cài đúng Vèo Windows r32
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-lite-r32'
          $Tag = 'veo-qa-windows-20261126-7bc6cdf'
          $Name = 'Veo-Windows-Signed-Flow-QA_0.3.24_x64-setup-r32.exe'
          if ((gh release view $Tag -R $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft) -ne 'true') { throw 'Không thấy bản nháp kiểm thử.' }
          gh release download $Tag -R $env:GITHUB_REPOSITORY --dir $Qa --pattern $Name
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash (Join-Path $Qa $Name)).Hash -ne '6248ad828dfa839f6e9f0f822c72ac1de9dca57d8cf5b4547bccbc857a38720b') { throw 'Sai bộ cài thử.' }
          $Install = Join-Path $Qa 'app'
          if ($env:GITHUB_ACTIONS -ne 'true' -or (Test-Path $Install)) { throw 'Cần máy thử có thư mục cài trống.' }
          $Process = Start-Process (Join-Path $Qa $Name) -ArgumentList @('/S',"/D=$Install") -PassThru
          if (!$Process.WaitForExit(240000)) { $Process.Kill($true); throw 'Cài Vèo quá thời gian.' }
          if ($Process.ExitCode -ne 0 -or (Get-Item (Join-Path $Install 'msx-phong-dung.exe')).VersionInfo.FileVersion -notmatch '^0\.3\.24(\.0)?$') { throw 'Sai phiên bản đã cài.' }
      - name: Duyệt ảnh, chặn vượt ngân sách và phát lại MP4
        shell: pwsh
        run: |
          $Qa = Join-Path $env:RUNNER_TEMP 'veo-qa-lite-r32'
          $Install = Join-Path $Qa 'app'
          $env:VEO_QA_WORKER_SHA = (Get-FileHash (Join-Path $Install 'worker/dung-app.mjs')).Hash.ToLowerInvariant()
          if ($env:VEO_QA_WORKER_SHA -ne '70930267c689bc91a09f31db2435e848d46b9f509360b85eef4046c7fd04ba54') { throw 'Sai mã phần dựng.' }
          $env:VEO_QA_SOURCE = 'dfd3616009fdc55e247855e652e270921b2526b9'
          $env:VEO_QA_OS = (Get-CimInstance Win32_OperatingSystem).Caption
          $Data = Join-Path $env:APPDATA 'vn.msxgroup.phongdung'
          if (Test-Path $Data) { throw 'Cần máy thử có kho trống.' }
          $env:DUNG_CHEP_LOI = 'may'
          $env:NO_PROXY = '127.0.0.1,localhost'
          $Script = Join-Path $Qa 'kiem-veo-lite-r32.ps1'
          foreach ($File in @('kiem-veo-lite-r32.ps1', 'kiem-ai-truc-tiep-r27.ps1', 'veo-lite-cloud-thu.cjs')) {
            Invoke-WebRequest "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/scripts/windows/$File" -OutFile (Join-Path $Qa $File)
          }
          & pwsh -NoProfile -STA -File $Script -Install $Install -Qa $Qa
          if ($LASTEXITCODE -ne 0) { throw 'Ca kiểm Veo 3.1 Lite thất bại.' }
      - name: Lưu ảnh, lượt Cloud thử và MP4
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veo-r32-lite-windows
          path: ${{ runner.temp }}/veo-qa-lite-r32/minh-chung
          if-no-files-found: warn
          retention-days: 30
