name: Kiểm bản gộp Vèo 0.3.18 trên Windows
on:
  push:
    branches: [kiem-veo-0318-gop]
permissions:
  contents: write
env:
  SHA_MOI: '189B60A47034AD5DAC53F34A2262D9F0428CB01E531194FF30F397493D18D39B'
jobs:
  cai-moi:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Cài mới, mở app và gọi phần dựng
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'veo-setup.exe'
          gh release download v0.3.18 -R CNTTMSXGROUP/veo-ban-cai -p 'Veo_0.3.18_x64-setup.exe' -O $setup
          if ($LASTEXITCODE -ne 0) { throw 'Chưa tải được bộ cài từ bản nháp' }
          if ((Get-FileHash $setup).Hash -ne $env:SHA_MOI) { throw 'Bộ cài trên bản nháp không phải bản gộp vừa đóng gói' }
          $install = Join-Path $env:RUNNER_TEMP 'Veo'
          $p = Start-Process $setup -ArgumentList '/S',"/D=$install" -PassThru
          if (!$p.WaitForExit(240000) -or $p.ExitCode -ne 0) { throw 'Trình cài không hoàn tất' }
          $exe = Join-Path $install 'msx-phong-dung.exe'
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductVersion -notmatch '^0\.3\.18(\.0)?$') { throw "Sai phiên bản $($info.ProductVersion)" }
          if ($info.CompanyName -ne 'MSX Tech') { throw 'Sai tên đơn vị phát triển' }
          $app = Start-Process $exe -PassThru
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          $until = (Get-Date).AddSeconds(60); $found = $null
          do {
            $app.Refresh()
            if ($app.HasExited) { throw 'Cửa sổ Vèo đã đóng' }
            if ($app.MainWindowHandle -ne [IntPtr]::Zero) {
              $w = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
              $c = [System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::NameProperty,'Tiếp tục với Google')
              $found = $w.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$c)
            }
            if (!$found) { Start-Sleep -Milliseconds 300 }
          } while (!$found -and (Get-Date) -lt $until)
          if (!$found) { throw 'Chưa thấy màn đăng nhập' }
          Write-Output 'TEST: Đã mở Vèo 0.3.18, thấy màn đăng nhập.'
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw 'Ứng dụng thoát sau khi mở' }
          & (Join-Path $install 'ffmpeg.exe') -v error -f lavfi -i 'sine=d=0.25:r=48000' -c:a libmp3lame -y (Join-Path $env:RUNNER_TEMP 'thu.mp3')
          if ($LASTEXITCODE -ne 0) { throw 'Bộ cài chưa xuất được MP3' }
          $node = Join-Path $install 'node.exe'; $worker = Join-Path $install 'worker/dung-app.mjs'
          if (!(Test-Path $node) -or !(Test-Path $worker)) { throw 'Thiếu phần dựng đã cài' }
          $si = [Diagnostics.ProcessStartInfo]::new($node)
          $si.ArgumentList.Add($worker); $si.UseShellExecute = $false
          $si.RedirectStandardOutput = $true; $si.RedirectStandardInput = $true
          $si.Environment['DUNG_DATA'] = Join-Path $env:RUNNER_TEMP 'du-an-thu'
          $child = [Diagnostics.Process]::Start($si)
          try {
            $read = $child.StandardOutput.ReadLineAsync()
            if (!$read.Wait(60000)) { throw 'Phần dựng chưa sẵn sàng' }
            $boot = $read.Result | ConvertFrom-Json
            $base = "http://127.0.0.1:$($boot.port)"; $h = @{ 'x-dung-token' = $boot.token }
            $state = Invoke-RestMethod "$base/api/state" -Headers $h
            if ($null -eq $state.projects) { throw 'Thiếu trạng thái ứng dụng' }
            # tuyến lưu thứ tự kéo thả chỉ có ở bản gộp: gửi sai phải bị chặn đúng câu báo
            $r = Invoke-WebRequest "$base/api/thu-tu" -Method Post -Headers $h -ContentType 'application/json' -Body '{"videos":"A"}' -SkipHttpErrorCheck
            if ($r.StatusCode -ne 400 -or $r.Content -notmatch 'Thứ tự gửi lên không hợp lệ') { throw "Phần dựng chưa có lưu thứ tự kéo thả ($($r.StatusCode))" }
            $r = Invoke-WebRequest "$base/api/thu-tu" -Method Post -Headers $h -ContentType 'application/json' -Body '{"videos":[],"folders":[]}' -SkipHttpErrorCheck
            if ($r.StatusCode -ne 200) { throw "Lưu thứ tự rỗng lỗi $($r.StatusCode)" }
            Write-Output 'TEST: Phần dựng chạy, có lưu thứ tự kéo thả.'
          } finally {
            if (!$child.HasExited) { $child.Kill($true) }
            if (!$app.HasExited) { $app.Kill($true) }
          }

  nang-cap:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        thu_muc: [mac-dinh, tuy-chon]
    steps:
      - name: Cài 0.3.17, nâng lên bản gộp, tự mở lại
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Join-Path $env:RUNNER_TEMP 'veo-cu.exe'
          Invoke-WebRequest 'https://github.com/CNTTMSXGROUP/veo-ban-cai/releases/download/v0.3.17-r2/Veo_0.3.17_x64-setup.exe' -OutFile $old
          if ((Get-FileHash $old).Hash -ne 'F0CFEB72A89CE5E63DE20C787851DA6D9A50587FFBBB6C3885A8945DA100A599') { throw 'Sai bộ cài 0.3.17' }
          $custom = '${{ matrix.thu_muc }}' -eq 'tuy-chon'
          $install = if ($custom) { Join-Path $env:RUNNER_TEMP 'Veo-custom' } else { Join-Path $env:LOCALAPPDATA 'Vèo' }
          $a = if ($custom) { @('/S',"/D=$install") } else { @('/S') }
          $p = Start-Process $old -ArgumentList $a -Wait -PassThru
          if ($p.ExitCode) { throw "Cài 0.3.17 lỗi $($p.ExitCode)" }
          $exe = Join-Path $install 'msx-phong-dung.exe'
          if ((Get-Item $exe).VersionInfo.ProductVersion -notmatch '^0\.3\.17(\.0)?$') { throw 'Chưa cài được 0.3.17' }
          $moi = Join-Path $env:RUNNER_TEMP 'veo-moi.exe'
          gh release download v0.3.18 -R CNTTMSXGROUP/veo-ban-cai -p 'Veo_0.3.18_x64-setup.exe' -O $moi
          if ((Get-FileHash $moi).Hash -ne $env:SHA_MOI) { throw 'Bộ cài trên bản nháp không phải bản gộp' }
          # như app tự cập nhật: chạy trình cài ở chế độ cập nhật, mở lại app sau khi xong
          $p = Start-Process $moi -ArgumentList '/P','/UPDATE','/R' -PassThru
          if (!$p.WaitForExit(240000) -or $p.ExitCode -ne 0) { throw "Cập nhật lỗi $($p.ExitCode)" }
          $ver = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Vèo'
          $noiCai = (Get-ItemProperty $key).InstallLocation.Trim('"')
          if ($ver -notmatch '^0\.3\.18(\.0)?$' -or $noiCai -ne $install) { throw "Sai vị trí hoặc phiên bản: $noiCai $ver" }
          Write-Output "TEST: Đã nâng tại chỗ ở $noiCai lên $ver."
          $until = (Get-Date).AddSeconds(30)
          do { $chay = Get-Process msx-phong-dung -ErrorAction SilentlyContinue | Select-Object -First 1; if (!$chay) { Start-Sleep 1 } } while (!$chay -and (Get-Date) -lt $until)
          if (!$chay) { throw 'Cập nhật xong nhưng Vèo chưa tự mở lại' }
          Write-Output "TEST: Vèo tự mở lại (PID $($chay.Id))."
          Get-Process msx-phong-dung -ErrorAction SilentlyContinue | Stop-Process -Force
